<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>_lpt_ Tarot 3D</title>
    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-light: #ffec8b;
            --gold-glow: #ffae00;
            --bg-dark: #050407;
            --card-w: 120px;
            --card-h: 200px;
        }

        @media (max-width: 600px) {
            :root {
                --card-w: 85px;
                --card-h: 145px;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--gold-light);
            font-family: 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            z-index: 2;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--gold-glow), 0 0 30px var(--gold-primary);
        }

        /* Khung điều khiển Đen - Vàng Kim */
        .controls-box {
            z-index: 2;
            width: 100%;
            max-width: 650px;
            background: rgba(12, 10, 18, 0.9);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--gold-primary);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--gold-light);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px var(--gold-primary);
        }

        select {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--gold-primary);
            border-radius: 6px;
            padding: 10px;
            color: var(--gold-primary);
            font-weight: bold;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Sân khấu bài 3D tách rời */
        .card-stage {
            z-index: 2;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            min-height: calc(var(--card-h) + 20px);
            margin: 10px 0 20px 0;
            width: 100%;
            max-width: 1050px;
            perspective: 1200px;
        }

        /* Thẻ bài 3D */
        .card-slot {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border-radius: 8px;
            cursor: pointer;
        }

        .card-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 215, 0, 0.2);
        }

        /* HIỆU ỨNG CHẠM / PHÁT SÁNG VÀNG KIM */
        .card-slot:hover .card-inner, 
        .card-slot:active .card-inner {
            box-shadow: 0 0 25px var(--gold-primary), 0 0 40px var(--gold-glow);
            transform: scale(1.05);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid var(--gold-primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back {
            background: #0a0a0c;
            background-image: radial-gradient(var(--gold-primary) 1px, transparent 0);
            background-size: 8px 8px;
        }

        .card-front {
            background-color: #000;
            transform: rotateY(180deg);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Khung thông tin giải nghĩa */
        .info-box {
            text-align: center;
            max-width: 650px;
            width: 100%;
            min-height: 90px;
            background: rgba(10, 8, 15, 0.9);
            border: 1px solid var(--gold-primary);
            border-radius: 10px;
            padding: 12px;
            z-index: 2;
            backdrop-filter: blur(8px);
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--gold-primary);
            margin-bottom: 6px;
            font-weight: bold;
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .card-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .upright { background: rgba(255, 215, 0, 0.2); color: var(--gold-primary); border: 1px solid var(--gold-primary); }
        .reversed { background: rgba(255, 69, 0, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; }

        .card-desc { font-size: 0.85rem; line-height: 1.4; color: #eee; }

        /* Xấp bài chọn rút (Che kín mặt sau) */
        .deck-area {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .interactive-deck {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            cursor: pointer;
            perspective: 800px;
        }

        .deck-card-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: 2px solid var(--gold-primary);
            background: #0a0a0c;
            background-image: radial-gradient(var(--gold-primary) 1px, transparent 0);
            background-size: 8px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        /* Chạm/hover xấp bài phát sáng */
        .interactive-deck:hover .deck-card-layer,
        .interactive-deck:active .deck-card-layer {
            box-shadow: 0 0 30px var(--gold-primary), 0 0 15px var(--gold-glow);
            border-color: #fff;
            transform: translateY(-5px);
        }

        /* Nút thao tác Đen - Vàng kim */
        .action-btns {
            display: flex;
            gap: 12px;
            z-index: 2;
        }

        .btn {
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transition: all 0.2s;
        }

        .btn:hover, .btn:active {
            box-shadow: 0 0 25px var(--gold-primary);
            transform: scale(1.03);
        }

        .btn-outline {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
        }

        .btn-outline:hover {
            background: rgba(255, 215, 0, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <header>
        <h1>_lpt_ TAROT 3D</h1>
    </header>

    <div class="controls-box">
        <input type="text" id="userQuestion" placeholder="Nhập câu hỏi của bạn...">
        <select id="cardCountSelect" onchange="initSpread()">
            <option value="1">1 lá</option>
            <option value="2">2 lá</option>
            <option value="3" selected>3 lá</option>
            <option value="4">4 lá</option>
            <option value="5">5 lá</option>
            <option value="6">6 lá</option>
            <option value="7">7 lá</option>
            <option value="8">8 lá</option>
            <option value="9">9 lá</option>
        </select>
    </div>

    <!-- Sân khấu hiển thị các lá bài tách rời nghiêng 3D -->
    <div class="card-stage" id="cardStage"></div>

    <!-- Khung thông tin bài -->
    <div class="info-box">
        <div id="cardTitle" class="card-title">Chạm vào xấp bài để rút lá bài tiếp theo</div>
        <div id="cardBadge" class="card-badge" style="display: none;"></div>
        <div id="cardDesc" class="card-desc">Tập trung tư tưởng vào câu hỏi của bạn.</div>
    </div>

    <!-- Xấp bài rút (Ẩn kín bài) -->
    <div class="deck-area">
        <div class="interactive-deck" id="interactiveDeck" onclick="drawNextCard()" onmouseenter="previewNextCard()" onmouseleave="restoreInfo()">
            <div class="deck-card-layer" style="transform: translateZ(-8px) translateY(4px);"></div>
            <div class="deck-card-layer" style="transform: translateZ(-4px) translateY(2px);"></div>
            <div class="deck-card-layer" id="topDeckCard"></div>
        </div>
    </div>

    <!-- Nút điều khiển -->
    <div class="action-btns">
        <button class="btn btn-outline" onclick="redrawLastCard()">Rút Lại Lá Cuối</button>
        <button class="btn" onclick="initSpread()">Trải Bài Lại</button>
    </div>

    <script>
        // 1. NỀN KIM TUYẾN
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
                this.speedAlpha = (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1);
                this.vy = -(Math.random() * 0.3 + 0.1);
            }
            update() {
                this.y += this.vy;
                this.alpha += this.speedAlpha;
                if (this.alpha <= 0 || this.alpha >= 1) this.speedAlpha *= -1;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        for (let i = 0; i < 45; i++) particles.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 2. DỮ LIỆU BÀI TAROT CÓ HÌNH ẢNH HD 100%
        const rawDeck = [
            { name: "0. The Fool (Kẻ Khờ)", img: "https://sacred-texts.com/tarot/pkt/img/ar00.jpg", desc: "Khởi đầu mới, tự do, tiềm năng vô hạn và niềm tin ngây thơ." },
            { name: "I. The Magician (Pháp Sư)", img: "https://sacred-texts.com/tarot/pkt/img/ar01.jpg", desc: "Ý chí mạnh mẽ, sự chủ động, tập trung và khả năng hiện thực hóa." },
            { name: "II. The High Priestess (Nữ Tư Tế)", img: "https://sacred-texts.com/tarot/pkt/img/ar02.jpg", desc: "Trực giác nhạy bén, tri thức ẩn giấu, góc nhìn nội tâm và sự tĩnh lặng." },
            { name: "III. The Empress (Hoàng Hậu)", img: "https://sacred-texts.com/tarot/pkt/img/ar03.jpg", desc: "Sự trù phú, nuôi dưỡng, tình yêu thương và sự phát triển rực rỡ." },
            { name: "IV. The Emperor (Hoàng Đế)", img: "https://sacred-texts.com/tarot/pkt/img/ar04.jpg", desc: "Quyền lực, kỷ luật, cấu trúc vững chắc và sự bảo hộ." },
            { name: "V. The Hierophant (Tư Tế)", img: "https://sacred-texts.com/tarot/pkt/img/ar05.jpg", desc: "Truyền thống, niềm tin đạo đức và sự dẫn dắt từ kinh nghiệm." },
            { name: "VI. The Lovers (Tình Nhân)", img: "https://sacred-texts.com/tarot/pkt/img/ar06.jpg", desc: "Tình yêu, sự hòa hợp, sự lựa chọn và gắn kết tâm hồn." },
            { name: "VII. The Chariot (Cỗ Xe)", img: "https://sacred-texts.com/tarot/pkt/img/ar07.jpg", desc: "Ý chí chiến thắng, sự quyết tâm vượt qua khó khăn." },
            { name: "VIII. Strength (Sức Mạnh)", img: "https://sacred-texts.com/tarot/pkt/img/ar08.jpg", desc: "Sức mạnh nội tâm, lòng dũng cảm, sự kiên nhẫn và dịu dàng." },
            { name: "IX. The Hermit (Ẩn Sĩ)", img: "https://sacred-texts.com/tarot/pkt/img/ar09.jpg", desc: "Sự chiêm nghiệm, chiêm nghiệm bản ngã và khoảng lặng nội tâm." },
            { name: "X. Wheel of Fortune (Bánh Xe Vận Mệnh)", img: "https://sacred-texts.com/tarot/pkt/img/ar10.jpg", desc: "Vận mệnh đổi thay, cơ hội mới và chu kỳ phát triển mới." },
            { name: "XI. Justice (Công Lý)", img: "https://sacred-texts.com/tarot/pkt/img/ar11.jpg", desc: "Công bằng, sự thật, nhân quả và quyết định minh bạch." },
            { name: "XII. The Hanged Man (Người Treo Cổ)", img: "https://sacred-texts.com/tarot/pkt/img/ar12.jpg", desc: "Sự dừng lại, buông bỏ và nhìn nhận mọi việc dưới góc nhìn mới." },
            { name: "XIII. Death (Tử Thần)", img: "https://sacred-texts.com/tarot/pkt/img/ar13.jpg", desc: "Kết thúc chu kỳ cũ để tái sinh và khởi đầu chương mới." },
            { name: "XIV. Temperance (Chừng Mực)", img: "https://sacred-texts.com/tarot/pkt/img/ar14.jpg", desc: "Sự cân bằng, kiên nhẫn, điều độ và hòa hợp." },
            { name: "XV. The Devil (Ác Quỷ)", img: "https://sacred-texts.com/tarot/pkt/img/ar15.jpg", desc: "Sự ràng buộc, cám dỗ, vật chất và thói quen cần giải phóng." },
            { name: "XVI. The Tower (Tòa Tháp)", img: "https://sacred-texts.com/tarot/pkt/img/ar16.jpg", desc: "Sự sụp đổ bất ngờ mang lại sự tỉnh thức và giải thoát." },
            { name: "XVII. The Star (Ngôi Sao)", img: "https://sacred-texts.com/tarot/pkt/img/ar17.jpg", desc: "Hy vọng, niềm tin, sự chữa lành và cảm hứng rực rỡ." },
            { name: "XVIII. The Moon (Mặt Trăng)", img: "https://sacred-texts.com/tarot/pkt/img/ar18.jpg", desc: "Nỗi sợ mơ hồ, tiềm thức và lắng nghe trực giác." },
            { name: "XIX. The Sun (Mặt Trời)", img: "https://sacred-texts.com/tarot/pkt/img/ar19.jpg", desc: "Thành công, năng lượng ấm áp, niềm vui và sự rõ ràng." },
            { name: "XX. Judgement (Phán Xét)", img: "https://sacred-texts.com/tarot/pkt/img/ar20.jpg", desc: "Lời gọi thức tỉnh, phán xét công tâm và sự tha thứ." },
            { name: "XXI. The World (Thế Giới)", img: "https://sacred-texts.com/tarot/pkt/img/ar21.jpg", desc: "Sự viên mãn, trọn vẹn và hoàn thành hành trình xuất sắc." }
        ];

        // 3. LOGIC XỬ LÝ
        let currentDeck = [];
        let drawnCards = [];
        let isAnimating = false;

        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function initSpread() {
            const stage = document.getElementById('cardStage');
            stage.innerHTML = '';
            drawnCards = [];
            currentDeck = shuffle(rawDeck);

            const count = parseInt(document.getElementById('cardCountSelect').value);
            for (let i = 0; i < count; i++) {
                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.id = `slot-${i}`;
                slot.innerHTML = `
                    <div class="card-inner" id="inner-${i}">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front"><img id="img-${i}" src="" alt="Tarot Card"></div>
                    </div>
                `;
                stage.appendChild(slot);
            }

            restoreInfo();
        }

        function drawNextCard() {
            const count = parseInt(document.getElementById('cardCountSelect').value);
            if (isAnimating || drawnCards.length >= count) return;
            isAnimating = true;

            const card = currentDeck.pop();
            const isReversed = Math.random() < 0.5;
            const cardData = { ...card, isReversed };
            drawnCards.push(cardData);

            const idx = drawnCards.length - 1;
            const inner = document.getElementById(`inner-${idx}`);
            const img = document.getElementById(`img-${idx}`);

            img.src = cardData.img;
            
            const rotZ = isReversed ? 180 : 0;
            inner.style.transform = `rotateY(180deg) rotateZ(${rotZ}deg)`;

            const slot = document.getElementById(`slot-${idx}`);
            slot.onclick = () => showCardInfo(cardData, idx + 1);

            setTimeout(() => {
                showCardInfo(cardData, idx + 1);
                isAnimating = false;
            }, 600);
        }

        function redrawLastCard() {
            if (isAnimating || drawnCards.length === 0) return;

            const idx = drawnCards.length - 1;
            const card = drawnCards.pop();

            const inner = document.getElementById(`inner-${idx}`);
            inner.style.transform = `rotateY(0deg) rotateZ(0deg)`;
            document.getElementById(`img-${idx}`).src = "";

            currentDeck.push(card);
            restoreInfo();
        }

        function previewNextCard() {
            if (isAnimating) return;
            const count = parseInt(document.getElementById('cardCountSelect').value);
            if (drawnCards.length >= count) return;

            document.getElementById('cardTitle').textContent = `Chuẩn bị rút lá thứ ${drawnCards.length + 1} / ${count}`;
            document.getElementById('cardBadge').style.display = "none";
            document.getElementById('cardDesc').textContent = "Nhấp vào xấp bài để lật mở thông điệp bí ẩn!";
        }

        function restoreInfo() {
            const count = parseInt(document.getElementById('cardCountSelect').value);
            if (drawnCards.length > 0) {
                const lastIdx = drawnCards.length - 1;
                showCardInfo(drawnCards[lastIdx], lastIdx + 1);
            } else {
                document.getElementById('cardTitle').textContent = `Sẵn sàng rút lá bài thứ 1 / ${count}`;
                document.getElementById('cardBadge').style.display = "none";
                document.getElementById('cardDesc').textContent = "Tập trung tư tưởng vào câu hỏi của bạn.";
            }
        }

        function showCardInfo(card, position) {
            const q = document.getElementById('userQuestion').value.trim();
            const qPrefix = q ? `[Câu hỏi: "${q}"] ` : '';

            document.getElementById('cardTitle').textContent = `Lá thứ ${position}: ${card.name}`;
            const badge = document.getElementById('cardBadge');
            badge.style.display = "inline-block";

            if (card.isReversed) {
                badge.textContent = "Chiều Ngược (Reversed)";
                badge.className = "card-badge reversed";
                document.getElementById('cardDesc').textContent = `${qPrefix}${card.desc} (Góc nhìn ngược: Năng lượng có thể bị cản trở hoặc cần điều chỉnh).`;
            } else {
                badge.textContent = "Chiều Xuôi (Upright)";
                badge.className = "card-badge upright";
                document.getElementById('cardDesc').textContent = `${qPrefix}${card.desc}`;
            }
        }

        // 4. XOAY VÀ NGHIÊNG BÀI 3D THEO HƯỚNG CHUỘT
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            const rotateX = y * -15;
            const rotateY = x * 15;

            const slots = document.querySelectorAll('.card-slot');
            slots.forEach(slot => {
                slot.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
        });

        // Khởi tạo
        initSpread();
    </script>
</body>
</html>
